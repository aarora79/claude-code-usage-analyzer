[project]
name = "claude-code-usage-analyzer"
version = "1.1.0"
description = "Comprehensive usage and cost analysis tool for Claude Code with detailed breakdowns by model and token type"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Claude Code Users" }
]
keywords = ["claude", "anthropic", "usage", "cost-analysis", "llm", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The core tool uses only the Python standard library. Charts are an optional extra.
dependencies = []

[project.optional-dependencies]
charts = [
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/claude-code-usage-analyzer"
Repository = "https://github.com/yourusername/claude-code-usage-analyzer.git"
Issues = "https://github.com/yourusername/claude-code-usage-analyzer/issues"

[project.scripts]
claude-usage-analyzer = "claude_code_usage_analyzer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
]

[tool.hatchling.build.targets.wheel]
packages = ["src/claude_code_usage_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# dashboard.py embeds a long HTML/CSS/JS template string; line length does not apply.
"src/claude_code_usage_analyzer/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
