[project]
name = "claude-code-usage-analyzer"
version = "1.0.0"
description = "Comprehensive usage and cost analysis tool for Claude Code with detailed breakdowns by model and token type"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Claude Code Users" }
]
keywords = ["claude", "anthropic", "usage", "cost-analysis", "llm", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/yourusername/claude-code-usage-analyzer"
Repository = "https://github.com/yourusername/claude-code-usage-analyzer.git"
Issues = "https://github.com/yourusername/claude-code-usage-analyzer/issues"

[project.scripts]
claude-usage-analyzer = "claude_code_usage_analyzer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatchling.build.targets.wheel]
packages = ["src/claude_code_usage_analyzer"]
